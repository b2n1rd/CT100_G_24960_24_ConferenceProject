<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Conference Registration</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav>
        <a href="index.html">Home</a>
        <a href="register.html">Register</a>
    </nav>

    <div class="container">
        <h2>Conference Registration Form</h2>
        <form id="regForm" action="process.php" method="POST" onsubmit="return validateForm()">
            
            <div class="form-group">
                <label>Full Name:</label>
                <input type="text" id="fullname" name="fullname">
                <span id="nameError" class="error"></span>
            </div>

            <div class="form-group">
                <label>Admission Number:</label>
                <input type="text" id="admission" name="admission" value="CT100/G/24960/24">
            </div>

            <div class="form-group">
                <label>Email Address:</label>
                <input type="email" id="email" name="email">
                <span id="emailError" class="error"></span>
            </div>

            <div class="form-group">
                <label>Phone Number (10 digits):</label>
                <input type="tel" id="phone" name="phone" maxlength="10">
                <span id="phoneError" class="error"></span>
            </div>

            <div class="form-group">
                <label>Year of Study:</label>
                <select id="year" name="year">
                    <option value="">--Select Year--</option>
                    <option value="1">Year 1</option>
                    <option value="2">Year 2</option>
                    <option value="3">Year 3</option>
                    <option value="4">Year 4</option>
                </select>
            </div>

            <div class="form-group">
                <label>Participation Category:</label>
                <select id="category" name="category" onchange="showWorkshop()">
                    <option value="">--Select Category--</option>
                    <option value="Conference Only">Conference Only</option>
                    <option value="Workshop Participant">Workshop Participant</option>
                </select>
                <span id="catError" class="error"></span>
            </div>

            <div class="form-group">
                <label>Number of Conference Days (1-3):</label>
                <input type="number" id="days" name="days" value="1" min="1" max="3" oninput="calculateFee()">
                <span id="daysError" class="error"></span>
            </div>

            <div class="form-group" id="workshopDiv" style="display:none;">
                <label>Workshop Selection:</label>
                <select id="workshop" name="workshop" onchange="calculateFee()">
                    <option value="None">None</option>
                    <option value="Web Development">Web Development (KSh 750)</option>
                </select>
            </div>

            <div class="form-group">
                <label>Meal Option (Lunch @ KSh 300/day):</label>
                <select id="meals" name="meals" onchange="calculateFee()">
                    <option value="No">No</option>
                    <option value="Yes">Yes</option>
                </select>
            </div>

            <h3>Total Fee: KSh <span id="displayTotal">1500</span></h3>
            <input type="hidden" id="hiddenTotal" name="hiddenTotal" value="1500">
            <p id="discountMsg" style="color: green; font-weight: bold;"></p>
            <br>
            <button type="submit">Submit Registration</button>
        </form>
    </div>

    <script src="js/script.js"></script>
</body>
</html>
